spring.application.name=lab-scheduler

# ============================================================
# Server Port
# Override with PORT environment variable (e.g. PORT=9090)
# ============================================================
server.port=${PORT:8080}

# ============================================================
# Database Configuration
# Override with environment variables: DB_URL, DB_USER, DB_PASSWORD
# Fallback: reads from config.properties in classpath
# ============================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lab_scheduler?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# CORS Allowed Origins
# CORS_ALLOWED_ORIGINS: comma-separated list of allowed frontend origins
# Default: http://localhost:3000 (Next.js dev), http://localhost:5500 (live-server)
# Example: set CORS_ALLOWED_ORIGINS=http://localhost:3000,https://myapp.example.com
# ============================================================
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5500,http://127.0.0.1:5500}

# Jackson Formatting
spring.jackson.serialization.indent-output=true

# Logging Configuration
logging.level.com.lab=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
